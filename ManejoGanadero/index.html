<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gestión Ganadera</title>
  
  <!-- SDK Oficial de Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --blue-primary: #1d72b8;
      --blue-hover: #155a92;
      --bg-card: #ffffff;
      --text-main: #1c252e;
      --text-muted: #637381;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, var(--text-main));
    }

    .header-card {
      background: linear-gradient(135deg, #1d72b8, #0d47a1);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(29, 114, 184, 0.2);
      text-align: center;
    }

    .header-card h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    .header-card p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 12px 4px;
      letter-spacing: 0.5px;
    }

    .grid-menu {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-card {
      background-color: var(--bg-card);
      border: 2px solid var(--blue-primary);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .btn-card:active {
      background-color: #ebf4fc;
      transform: scale(0.98);
    }

    .btn-icon {
      background-color: var(--blue-primary);
      color: #ffffff;
      font-size: 22px;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-content h4 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: var(--blue-primary);
    }

    .btn-content p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <div class="header-card">
    <h2 id="saludo">¡Hola, Ganadero! 🤠</h2>
    <p>Sistema de Control y Gestión de Finca</p>
  </div>

  <div class="section-title">Módulos de Trabajo</div>
  
  <div class="grid-menu">
    
    <!-- 1. Registro de Animales -->
    <button class="btn-card" onclick="abrirModulo('Registro de Animales')">
      <div class="btn-icon">🐄</div>
      <div class="btn-content">
        <h4>Registro de Animales</h4>
        <p>Ingresa arete, peso, sexo y categoría (Bovina y Bufalina).</p>
      </div>
    </button>

    <!-- 2. Control de Salud -->
    <button class="btn-card" onclick="abrirModulo('Control de Salud')">
      <div class="btn-icon">💉</div>
      <div class="btn-content">
        <h4>Control de Salud</h4>
        <p>Registro de vacunas, desparasitaciones y tratamientos.</p>
      </div>
    </button>

    <!-- 3. Producción -->
    <button class="btn-card" onclick="abrirModulo('Producción')">
      <div class="btn-icon">🥛</div>
      <div class="btn-content">
        <h4>Producción</h4>
        <p>Registros de preñez, nacimiento, peso al nacer, GPD e intervalos entre partos.</p>
      </div>
    </button>

    <!-- 4. Potreros / Lotes -->
    <button class="btn-card" onclick="abrirModulo('Potreros y Lotes')">
      <div class="btn-icon">🌾</div>
      <div class="btn-content">
        <h4>Potreros / Lotes</h4>
        <p>Organización y ubicación del ganado por potrero.</p>
      </div>
    </button>

  </div>

  <script>
    // Inicializar Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Saludo personalizado con el nombre del usuario en Telegram
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById("saludo").innerText = `¡Hola, ${user.first_name}! 🤠`;
    }

    // Respuesta al hacer clic en los botones
    function abrirModulo(nombreModulo) {
      tg.showAlert(`Abriendo: ${nombreModulo}`);
    }
  </script>
</body>
</html>
