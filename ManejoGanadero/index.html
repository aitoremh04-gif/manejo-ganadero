<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gestión Ganadera</title>
  
  <!-- SDK Oficial de Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000);">
  <h1>Sistema de Gestión Ganadera</h1>
  <p>Mini App cargada correctamente.</p>

  <script>
    // Inicializar el SDK de Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Abre la app a pantalla completa
  </script>
</body>
</html>
