<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gestión Ganadera Hato Integral - Control de Roles</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --blue-primary: #1d72b8;
      --blue-hover: #155a92;
      --bg-card: #ffffff;
      --text-main: #1c252e;
      --text-muted: #637381;
      --bg-body: #f4f6f8;
      --alert-color: #d32f2f;
      --alert-bg: #fde8e8;
      --success-color: #2e7d32;
      --admin-badge: #7b1fa2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, var(--bg-body));
      color: var(--tg-theme-text-color, var(--text-main));
    }

    .header-card {
      background: linear-gradient(135deg, #1d72b8, #0d47a1);
      color: #ffffff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(29, 114, 184, 0.2);
      text-align: center;
      position: relative;
    }

    .header-card h2 { margin: 0 0 4px 0; font-size: 20px; }
    .header-card p { margin: 0; opacity: 0.9; font-size: 13px; }

    .role-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .role-admin { background-color: #e1bee7; color: #4a148c; }
    .role-operator { background-color: #c8e6c9; color: #1b5e20; }

    .sync-status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      display: inline-block;
      margin-top: 4px;
    }

    .grid-menu { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }

    .btn-card {
      background-color: var(--bg-card);
      border: 1.5px solid #dce0e4;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .btn-icon {
      background-color: var(--blue-primary);
      color: #ffffff;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-content h4 { margin: 0 0 2px 0; font-size: 14px; color: var(--blue-primary); }
    .btn-content p { margin: 0; font-size: 12px; color: var(--text-muted); }

    .module-view { display: none; background: var(--bg-card); border-radius: 16px; padding: 16px; }

    .module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eef0f2;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .module-header h3 { margin: 0; color: var(--blue-primary); font-size: 16px; }

    .btn-back {
      background: #eef6fc;
      color: var(--blue-primary);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .form-group { margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cfd8dc;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      background: #fafafa;
    }

    .btn-action {
      width: 100%;
      background-color: var(--blue-primary);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Estilos de Edición (Exclusivo Administrador) */
    .admin-only { display: none; }
    .btn-edit { background-color: #f57c00; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    .btn-delete { background-color: #d32f2f; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }

    .table-container { width: 100%; overflow-x: auto; margin-top: 16px; border: 1px solid #eef0f2; border-radius: 8px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
    .data-table th { background-color: #f0f4f8; padding: 8px 6px; border-bottom: 1px solid #cfd8dc; }
    .data-table td { padding: 8px 6px; border-bottom: 1px solid #eef0f2; }
  </style>
</head>
<body>

  <!-- Encabezado con detección de Rol -->
  <div class="header-card">
    <h2 id="saludo-usuario">¡Hola, Usuario! 🤠</h2>
    <p>Control del Hato Integral</p>
    <div id="badge-rol" class="role-badge role-operator">Cargando Rol...</div>
    <br>
    <div class="sync-status" id="estado-nube">☁️ Conectando con la Nube...</div>
  </div>

  <!-- MENU PRINCIPAL -->
  <div id="main-menu">
    <div class="grid-menu">
      <button class="btn-card" onclick="mostrarModulo('mod-1')">
        <div class="btn-icon">🌾</div>
        <div class="btn-content">
          <h4>1. Inventario por Potreros y Rotación</h4>
          <p>Potreros, especies, categorías y lotes.</p>
        </div>
      </button>

      <button class="btn-card" onclick="mostrarModulo('mod-2')">
        <div class="btn-icon">📅</div>
        <div class="btn-content">
          <h4>2. Planificación y Tareas</h4>
          <p>Asignación y avance.</p>
        </div>
      </button>

      <button class="btn-card" onclick="mostrarModulo('mod-9')">
        <div class="btn-icon">⛽</div>
        <div class="btn-content">
          <h4>3. Control de Combustible</h4>
          <p>Registro de Gasoil y Gasolina.</p>
        </div>
      </button>
    </div>
  </div>

  <!-- MODULO 1: ROTACION -->
  <div id="mod-1" class="module-view">
    <div class="module-header">
      <h3>1. Rotación de Potreros</h3>
      <button class="btn-back" onclick="volverMenu()">⬅️ Volver</button>
    </div>
    <div class="form-group">
      <label>Potrero:</label>
      <select class="form-control" id="mod1-potrero">
        <option>Macanillal</option><option>Mata del Muerto</option><option>Galpón</option><option>Manguito</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Categoría:</label><select class="form-control" id="mod1-categoria"><option>Bovinos</option><option>Bufalinos</option></select></div>
      <div class="form-group"><label>Cantidad:</label><input type="number" id="mod1-cantidad" class="form-control" placeholder="Ej: 30"></div>
    </div>
    
    <button class="btn-action" onclick="registrarRotacion()">Registrar Datos</button>

    <!-- Tabla con opciones de modificación solo para el Admin -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Potrero</th>
            <th>Cat.</th>
            <th>Cant.</th>
            <th class="admin-only">Acción Admin</th>
          </tr>
        </thead>
        <tbody id="tabla-rotacion-body">
          <!-- Los datos se renderizan dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const URL_SCRIPT_NUBE = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    // 🔴 DEFINE AQUÍ LOS IDS DE TELEGRAM O USERNAMES AUTORIZADOS COMO ADMINISTRADORES
    // Puedes poner tu ID numérico de Telegram (ej: 123456789) o tu username (ej: "juan_perez")
    const ADMIN_TELEGRAM_IDS = ["123456789", "tu_usuario_telegram"]; 

    let esAdministrador = false;
    let usuarioActual = { id: "", nombre: "Ganadero", username: "" };
    let listaRotaciones = [];

    document.addEventListener("DOMContentLoaded", () => {
      validarUsuarioYRol();
      cargarDatosDesdeNube();
    });

    // Validar Rol de Usuario según los datos devueltos por Telegram SDK
    function validarUsuarioYRol() {
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        usuarioActual.id = u.id ? u.id.toString() : "";
        usuarioActual.nombre = u.first_name || "Ganadero";
        usuarioActual.username = u.username || "";

        // Comprobar si coincide con el ID o Username de la lista Admin
        if (ADMIN_TELEGRAM_IDS.includes(usuarioActual.id) || ADMIN_TELEGRAM_IDS.includes(usuarioActual.username)) {
          esAdministrador = true;
        }
      } else {
        // En entorno local de pruebas (fuera de Telegram), asignamos rol por defecto
        console.warn("Ejecutando fuera del cliente oficial de Telegram.");
      }

      // Actualizar Interfaz según el Rol
      document.getElementById("saludo-usuario").innerText = `¡Hola, ${usuarioActual.nombre}! 🤠`;
      const badge = document.getElementById("badge-rol");

      if (esAdministrador) {
        badge.innerText = "👑 MODO ADMINISTRADOR (Lectura/Escritura/Edición)";
        badge.className = "role-badge role-admin";
        // Mostrar elementos exclusivos del administrador
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "table-cell");
      } else {
        badge.innerText = "👷 MODO OPERADOR (Solo Carga de Datos)";
        badge.className = "role-badge role-operator";
        // Ocultar elementos exclusivos del admin
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
      }
    }

    // Auto-Guardado en Nube
    function autoGuardarNube(modulo, datos, accion = "insertar", idRegistro = null) {
      document.getElementById("estado-nube").innerText = "⏳ Guardando...";
      
      const payload = {
        accion: accion,
        modulo: modulo,
        datos: datos,
        id: idRegistro
      };

      fetch(URL_SCRIPT_NUBE, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("estado-nube").innerText = "☁️ Sincronizado";
      })
      .catch(err => {
        console.error("Error al guardar:", err);
        document.getElementById("estado-nube").innerText = "❌ Error al conectar";
      });
    }

    // Registrar datos (Permitido para TODOS los usuarios)
    function registrarRotacion() {
      const potrero = document.getElementById("mod1-potrero").value;
      const cat = document.getElementById("mod1-categoria").value;
      const cant = parseInt(document.getElementById("mod1-cantidad").value) || 0;

      if (cant <= 0) return tg.showAlert("⚠️ Ingrese una cantidad válida.");

      const registro = { id: Date.now().toString(), potrero, cat, cant };
      listaRotaciones.unshift(registro);

      autoGuardarNube("RotacionPotreros", registro, "insertar");
      renderizarTablaRotacion();
      tg.showAlert("✅ Registro guardado en el sistema.");
    }

    // Renderizar la tabla con restricciones de Admin
    function renderizarTablaRotacion() {
      const tbody = document.getElementById("tabla-rotacion-body");
      tbody.innerHTML = "";

      listaRotaciones.forEach(item => {
        const tr = document.createElement("tr");

        let htmlCampos = `<td>${item.potrero}</td><td>${item.cat}</td><td>${item.cant}</td>`;
        
        // Agregar botones de acción si el usuario es Administrador
        if (esAdministrador) {
          htmlCampos += `
            <td class="admin-only">
              <button class="btn-edit" onclick="editarRegistro('${item.id}')">✏️ Edit</button>
              <button class="btn-delete" onclick="eliminarRegistro('${item.id}')">🗑️ Elim</button>
            </td>`;
        } else {
          htmlCampos += `<td class="admin-only" style="display:none;"></td>`;
        }

        tr.innerHTML = htmlCampos;
        tbody.appendChild(tr);
      });
    }

    // FUNCIONES EXCLUSIVAS DEL ADMINISTRADOR

    function editarRegistro(id) {
      if (!esAdministrador) return tg.showAlert("🚫 Acción denegada: Solo el administrador puede modificar datos.");

      const item = listaRotaciones.find(r => r.id === id);
      if (!item) return;

      const nuevaCant = prompt("✏️ Modificar cantidad de animales:", item.cant);
      if (nuevaCant !== null && nuevaCant !== "") {
        item.cant = parseInt(nuevaCant);
        renderizarTablaRotacion();
        autoGuardarNube("RotacionPotreros", item, "actualizar", id);
        tg.showAlert("✏️ Registro actualizado por el administrador.");
      }
    }

    function eliminarRegistro(id) {
      if (!esAdministrador) return tg.showAlert("🚫 Acción denegada: Solo el administrador puede eliminar registros.");

      if (confirm("⚠️ ¿Estás seguro de eliminar este registro del hato?")) {
        listaRotaciones = listaRotaciones.filter(r => r.id !== id);
        renderizarTablaRotacion();
        autoGuardarNube("RotacionPotreros", {}, "eliminar", id);
        tg.showAlert("🗑️ Registro eliminado.");
      }
    }

    function cargarDatosDesdeNube() {
      if (URL_SCRIPT_NUBE.includes("TU_SCRIPT_ID")) return;

      fetch(URL_SCRIPT_NUBE)
        .then(res => res.json())
        .then(data => {
          document.getElementById("estado-nube").innerText = "☁️ Datos al día";
          if (data.RotacionPotreros && data.RotacionPotreros.length > 1) {
            // Reconstruir lista excluyendo cabeceras
            listaRotaciones = data.RotacionPotreros.slice(1).map(row => ({
              id: row[0],
              potrero: row[2],
              cat: row[3],
              cant: row[4]
            }));
            renderizarTablaRotacion();
          }
        })
        .catch(err => console.error("Error al cargar datos:", err));
    }

    function mostrarModulo(id) {
      document.getElementById("main-menu").style.display = "none";
      document.querySelectorAll('.module-view').forEach(m => m.style.display = "none");
      document.getElementById(id).style.display = "block";
    }

    function volverMenu() {
      document.querySelectorAll('.module-view').forEach(m => m.style.display = "none");
      document.getElementById("main-menu").style.display = "block";
    }
  </script>
</body>
</html>
