<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manejo Ganadero</title>
  <!-- SDK oficial de Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Aquí va la interfaz HTML del sistema (formularios, tablas, botones) -->

  <script>
    // ==========================================================
    // GESTOR DE ALMACENAMIENTO NUBE (TELEGRAM CLOUDSTORAGE)
    // ==========================================================
    const StorageManager = {
      isTelegramAvailable: function() {
        return typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.CloudStorage;
      },

      guardar: function(clave, datos) {
        return new Promise((resolve) => {
          const stringData = typeof datos === 'string' ? datos : JSON.stringify(datos);
          
          try {
            localStorage.setItem(clave, stringData);
          } catch (e) {
            console.warn("Error al guardar localmente:", e);
          }

          if (this.isTelegramAvailable()) {
            Telegram.WebApp.CloudStorage.setItem(clave, stringData, (error, enviado) => {
              if (error) {
                console.error("Error en Telegram CloudStorage:", error);
                resolve(false);
              } else {
                resolve(true);
              }
            });
          } else {
            resolve(true);
          }
        });
      },

      cargar: function(clave) {
        return new Promise((resolve) => {
          if (this.isTelegramAvailable()) {
            Telegram.WebApp.CloudStorage.getItem(clave, (error, valor) => {
              if (!error && valor) {
                try { resolve(JSON.parse(valor)); return; } catch (e) { resolve(valor); return; }
              }
              const localData = localStorage.getItem(clave);
              resolve(localData ? JSON.parse(localData) : null);
            });
          } else {
            const localData = localStorage.getItem(clave);
            resolve(localData ? JSON.parse(localData) : null);
          }
        });
      }
    };

    // ==========================================================
    // FLUJO PRINCIPAL DE DATOS Y SINCRONIZACIÓN
    // ==========================================================
    const CLAVE_HATO = 'datos_hato_laguna_brava';
    let estadoHato = { animales: [], registros: [] };

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
      await cargarYSincronizar();
    });

    async function cargarYSincronizar() {
      const datosRemotos = await StorageManager.cargar(CLAVE_HATO);
      if (datosRemotos) {
        estadoHato = datosRemotos;
      }
      actualizarVistaUI();
    }

    async function guardarDatosSistema(nuevoRegistro) {
      if (!Array.isArray(estadoHato.animales)) {
        estadoHato.animales = [];
      }
      estadoHato.animales.push(nuevoRegistro);

      const guardadoExitoso = await StorageManager.guardar(CLAVE_HATO, estadoHato);
      if (guardadoExitoso) {
        actualizarVistaUI();
        notificarUsuario("Registro guardado y sincronizado.");
      } else {
        notificarUsuario("Guardado localmente. Verifique su conexión.");
      }
    }

    function actualizarVistaUI() {
      if (typeof renderizarTabla === 'function') {
        renderizarTabla(estadoHato.animales);
      }
    }

    function notificarUsuario(mensaje) {
      if (typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.showAlert) {
        Telegram.WebApp.showAlert(mensaje);
      } else {
        alert(mensaje);
      }
    }
  </script>
</body>
</html>
