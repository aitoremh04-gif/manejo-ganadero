    <label for="responsableNotificacion">Responsable que notifica:</label>
    <input type="text" id="responsableNotificacion" name="responsable_notificacion" class="form-control" placeholder="Nombre del responsable" required>
  </div>

  <!-- Campos existentes... -->

    <div class="resumen-item">
      <strong>Estado / Bienestar:</strong> <span id="resumenBienestarTexto">Sin evaluar</span>
    </div>
    <div class="resumen-item">
      <strong>Coordenadas Tomadas:</strong> 
      <span id="resumenCoordenadas">Lat: --, Lon: --</span>
    </div>
  </div>

  <button type="button" id="btnSubirEvento" onclick="registrarEvento()">Subir Evento</button>
</div>
