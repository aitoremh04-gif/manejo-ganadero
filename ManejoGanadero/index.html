<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gestión Ganadera</title>
  
  <!-- SDK Oficial de Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }

    .card {
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Encabezado de bienvenida -->
  <div class="card">
    <h2 id="saludo">¡Hola!</h2>
    <p>Bienvenido al Sistema de Gestión Ganadera.</p>
  </div>

  <!-- Menú de Opciones -->
  <div class="card">
    <h3>Menú Principal</h3>
    <button class="btn" onclick="alert('Módulo de Registro en desarrollo')">🐄 Registrar Animal</button>
    <button class="btn" onclick="alert('Módulo de Inventario en desarrollo')">📋 Ver Inventario</button>
  </div>

  <!-- SCRIPT DE TELEGRAM -->
  <script>
    // 1. Inicializar el SDK de Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Abre la app a pantalla completa

    // 2. Obtener datos del usuario de Telegram
    const user = tg.initDataUnsafe?.user;

    if (user) {
      // Personaliza el saludo con el nombre del usuario
      document.getElementById("saludo").innerText = `¡Hola, ${user.first_name}! 🤠`;
    }
  </script>
</body>
</html>
